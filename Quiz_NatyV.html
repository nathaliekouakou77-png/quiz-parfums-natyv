{id:'unknown',icon:'🤔',fr:['À conseiller','Je préfère être guidé(e)'],it:['Da consigliare','Vorrei un consiglio']} ]}
];
function tr(){return T[state.lang]}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function active(){return questions}
function current(){return active()[state.step]}
function itemLabel(id){const q=questions.find(x=>x.id===id),v=state.answers[id];const o=q?.opts?.find(o=>o.id===v);return o?o[state.lang][0]:tr().empty}
function profileKey(){const scores={fresh:0,floral:0,woody:0,gourmand:0,musky:0};for(const q of questions){const o=q.opts?.find(o=>o.id===state.answers[q.id]);if(o?.score)Object.entries(o.score).forEach(([k,w])=>scores[k]+=w)}return Object.keys(scores).sort((a,b)=>scores[b]-scores[a])[0]}
function textAnswer(name){return String(state.answers[name]||'').trim().slice(0,100)}
function msg(){const t=tr(),l=t.labels,p=profiles[profileKey()][state.lang];const lines=[t.messageIntro,'',`${l.profile}: ${p.name}`,`${l.recipient}: ${itemLabel('recipient')}`,`${l.audience}: ${itemLabel('audience')}`];
if(textAnswer('favorite'))lines.push(`${l.favorite}: ${textAnswer('favorite')}`);if(textAnswer('avoid'))lines.push(`${l.avoid}: ${textAnswer('avoid')}`);
for(const id of ['feeling','notes','sweetness','intensity','occasion','size'])lines.push(`${l[id]}: ${itemLabel(id)}`);
lines.push('',t.messageOutro);return lines.join('\n')}
function waLink(){return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg())}`}
function sc(){window.scrollTo({top:0,behavior:'smooth'})}
function render(){const t=tr();document.documentElement.lang=state.lang;document.title=`${t.heading} | NatyV Collection`;document.getElementById('footerLine').textContent=t.brand;document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===state.lang)));if(state.complete)result();else if(!state.started)intro();else question()}
function intro(){const t=tr();app.innerHTML=`<div class="hero"><div class="kicker">${t.eyebrow}</div><div class="hero-emblem" aria-hidden="true">🌹</div><h1>${t.heading}</h1><p class="subtitle">${t.intro}</p><div class="pills"><span class="pill">${t.duration}</span><span class="pill">✦ ${state.lang==='fr'?'Gratuit':'Gratuito'}</span><span class="pill">FR / IT</span></div><button class="btn btn-primary btn-wide" id="start" type="button">${t.start} →</button><p class="privacy">🔒 ${t.noSignup}</p></div>`;
document.getElementById('start').onclick=()=>{state.started=true;state.step=0;render();sc()}}
function refQuestion(){const t=tr(),rec=state.answers.recipient;const title=rec==='gift'?t.refTitleGift:rec==='self'?t.refTitleSelf:t.refTitleExplore;
app.innerHTML=`${progress()}<div class="question-head"><div class="kicker">${t.eyebrow}</div><h2>${title}</h2><p>${t.refDesc}</p></div><label class="field-label" for="favorite">${t.perfume}</label><input class="field" id="favorite" type="text" inputmode="text" maxlength="100" placeholder="${escapeHtml(t.favoritePlaceholder)}" autocomplete="off" value="${escapeHtml(state.answers.favorite||'')}"><label class="field-label" for="avoid">${t.avoid}</label><input class="field" id="avoid" type="text" inputmode="text" maxlength="100" placeholder="${escapeHtml(t.avoidPlaceholder)}" autocomplete="off" value="${escapeHtml(state.answers.avoid||'')}"><p class="optional-note">${t.fieldOptional}</p>${buttons(true)}`;
for(const id of ['favorite','avoid'])document.getElementById(id).addEventListener('input',e=>state.answers[id]=e.target.value);
nav();}
function progress(){const t=tr(),len=active().length;return `<div class="progress-head"><span>${t.question} ${state.step+1} ${t.of} ${len}</span><span>${Math.round(state.step/len*100)}%</span></div><div class="track" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(state.step/len*100)}"><div class="fill" style="width:${Math.round(state.step/len*100)}%"></div></div>`}
function buttons(optional=false){const t=tr(),last=state.step===active().length-1;return `<div class="question-actions"><button type="button" class="btn btn-ghost" id="back">← ${t.back}</button><button type="button" class="btn btn-primary" id="next" ${optional||state.answers[current().id]?'':'disabled'}>${last?t.finish:t.next} →</button></div>`}
function question(){const q=current(),t=tr();if(q.kind==='text'){refQuestion();return}const [heading,desc]=q[state.lang],sel=state.answers[q.id];app.innerHTML=`${progress()}<div class="question-head"><div class="kicker">${t.eyebrow}</div><h2>${escapeHtml(heading)}</h2><p>${escapeHtml(desc)}</p></div><div class="options" role="radiogroup" aria-label="${escapeHtml(heading)}">${q.opts.map(o=>{const checked=o.id===sel,[title,subtitle]=o[state.lang];return `<button type="button" role="radio" aria-checked="${checked}" class="option${checked?' is-selected':''}" data-answer="${escapeHtml(o.id)}"><span class="option-icon" aria-hidden="true">${o.icon}</span><span class="option-text"><span class="option-label">${escapeHtml(title)}</span><span class="option-detail">${escapeHtml(subtitle)}</span></span><span class="option-check" aria-hidden="true"></span></button>`}).join('')}</div>${buttons()}`;
app.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{state.answers[q.id]=el.dataset.answer;render()});nav()}
function nav(){document.getElementById('back').onclick=()=>{state.step=Math.max(0,state.step-1);if(state.step===0 && state.answers.recipient===undefined){state.started=false;}render();sc()};document.getElementById('next').onclick=()=>{const q=current();if(q.kind!=='text'&&!state.answers[q.id])return;if(state.step===active().length-1)state.complete=true;else state.step++;render();sc()}}
function result(){const t=tr(),p=profiles[profileKey()][state.lang];app.innerHTML=`<div class="result-top"><div class="kicker">${t.result}</div><div class="result-ornament" aria-hidden="true">${profiles[profileKey()].emoji}</div><h2 class="profile-name">${escapeHtml(p.name)}</h2><p class="subtitle">${escapeHtml(p.desc)}</p></div><div class="result-info"><h3>${t.advice}</h3><p>${escapeHtml(p.advice)}</p></div><div class="mini-label">${t.prefer}</div><ul class="detail-list">${['audience','notes','intensity','size'].map(id=>`<li><span class="bullet">✦</span><span>${escapeHtml(itemLabel(id))}</span></li>`).join('')}</ul>${textAnswer('favorite')?`<div class="personalized"><strong>${t.perfume} :</strong> ${escapeHtml(textAnswer('favorite'))}</div>`:''}<div class="divider"></div><p class="small-note">${t.notScientific}</p><div class="actions"><a class="btn btn-wa btn-wide" id="wa" href="${escapeHtml(waLink())}" target="_blank" rel="noopener noreferrer">${t.cta} ↗</a><p class="small-note">${t.ready}</p><button class="btn btn-outline btn-wide" id="copy" type="button">📋 ${t.copy}</button><button class="btn btn-ghost btn-wide" id="restart" type="button">↻ ${t.again}</button></div><div class="message-preview"><h3>💬 ${t.preview}</h3><pre>${escapeHtml(msg())}</pre></div>`;
document.getElementById('restart').onclick=()=>{state.step=0;state.started=false;state.complete=false;state.answers={};render();sc()};
document.getElementById('copy').onclick=async()=>{const m=msg();try{await navigator.clipboard.writeText(m)}catch(e){const a=document.createElement('textarea');a.value=m;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}document.getElementById('copy').textContent='✓ '+t.copied}}
document.querySelectorAll('[data-lang]').forEach(el=>el.onclick=()=>{state.lang=el.dataset.lang;render()});document.getElementById('homeLink').onclick=e=>{e.preventDefault();state.step=0;state.started=false;state.complete=false;state.answers={};render()};render();
</script>
</body>
</html>
